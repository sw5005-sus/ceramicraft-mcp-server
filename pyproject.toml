[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceramicraft-mcp-server"
version = "0.1.0"
description = "MCP Server for CeramiCraft multi-agent system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.26.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.12.1",
    "dttb>=0.3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
    "ty>=0.0.22",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
override-dependencies = [
    "cryptography>=46.0.7",
    "python-multipart>=0.0.26",
    "pygments>=2.20.0",
]
